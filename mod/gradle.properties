# Gradle
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false
org.gradle.parallel=true

# 依赖解析超时：官方源慢但可达（JVM 通道约 20-60KB/s），放宽读超时让其走完
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=300000

# Minecraft / Forge 版本
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# 模组信息
mod_id=xferbridge
mod_name=XferBridge
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.xferbridge
mod_authors=bubble
mod_description=Cross-save character & item migration bridge with an external companion tool.
